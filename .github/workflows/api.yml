name: API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/messenger-api ./cmd/api
      - name: Check API contract
        working-directory: backend
        run: |
          go run ./cmd/api -openapi /tmp/openapi.yaml
          diff -u ../contract/openapi.yaml /tmp/openapi.yaml

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build Linux binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/messenger-api ./cmd/api
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o IdentitiesOnly=yes /tmp/messenger-api "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/messenger-api.new"
          ssh -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          install -m 755 /tmp/messenger-api.new /usr/local/bin/messenger-api
          rm -f /tmp/messenger-api.new
          systemctl restart messenger-api
          sleep 1
          systemctl is-active messenger-api
          curl -fsS --max-time 10 http://127.0.0.1:8080/health
          echo
          EOF
      - name: Check public health
        run: |
          curl -fsS --max-time 15 https://messenger.publicvm.com/health
          echo
