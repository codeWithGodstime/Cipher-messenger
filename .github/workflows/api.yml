name: API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/messenger-api ./cmd/api
      - name: Check API contract
        working-directory: backend
        run: |
          go run ./cmd/api -openapi /tmp/openapi.yaml
          diff -u ../contract/openapi.yaml /tmp/openapi.yaml

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build Linux binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/messenger-api ./cmd/api
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -T 10 138.68.14.231 >> ~/.ssh/known_hosts
      - name: Upload and restart
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/messenger-api deploy/ensure-nginx-websocket.sh \
            root@138.68.14.231:/tmp/
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes root@138.68.14.231 'bash -s' <<'EOF'
          set -euo pipefail
          install -m 755 /tmp/messenger-api /usr/local/bin/messenger-api
          rm -f /tmp/messenger-api
          install -m 755 /tmp/ensure-nginx-websocket.sh /usr/local/sbin/ensure-nginx-websocket
          /usr/local/sbin/ensure-nginx-websocket
          systemctl restart messenger-api
          sleep 1
          systemctl is-active messenger-api
          curl -fsS --max-time 10 http://127.0.0.1:8080/health
          echo
          EOF
      - name: Check public health
        run: |
          curl -fsS --max-time 15 https://messenger.publicvm.com/health
          echo
