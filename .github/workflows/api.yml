name: API

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/messenger-api ./cmd/api
      - name: Check API contract
        working-directory: backend
        run: |
          go run ./cmd/api -openapi /tmp/openapi.yaml
          diff -u ../contract/openapi.yaml /tmp/openapi.yaml
