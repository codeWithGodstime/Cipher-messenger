openapi: 3.1.0
info:
  description: HTTP API for the Messenger app. Protected routes require an access
    token.
  title: Messenger API
  version: 1.0.0
paths:
  /auth/login:
    post:
      description: Returns a session when the username exists. Does not create accounts.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: Session for the existing username.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The username or JSON body is invalid.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      summary: Log in with a username
      tags:
      - Messenger
  /auth/logout:
    post:
      description: Revokes the session carried by the access token.
      operationId: logout
      responses:
        "204":
          description: The session was revoked.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Log out
      tags:
      - Messenger
  /auth/refresh:
    post:
      description: Rotates the refresh token and returns a new access token for the
        same session.
      operationId: refreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: New access and refresh tokens.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The JSON body is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The refresh token is invalid or expired.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      summary: Refresh a session
      tags:
      - Messenger
  /auth/signup:
    post:
      description: Creates an account when the username is free and returns a session.
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: Session for the new username.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The username or JSON body is invalid.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Username is already taken.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      summary: Sign up with a username
      tags:
      - Messenger
  /contacts:
    get:
      description: Returns peers the signed-in user has saved, newest first.
      operationId: listContacts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
          description: Saved contacts.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: List contacts
      tags:
      - Messenger
    post:
      description: Saves a registered peer by user_id or username. Idempotent for
        the same peer.
      operationId: addContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContact'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: The saved contact.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The JSON body, user_id, or username is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Add a contact
      tags:
      - Messenger
  /contacts/{id}:
    delete:
      description: Deletes a saved contact owned by the signed-in user.
      operationId: deleteContact
      parameters:
      - description: Contact id.
        in: path
        name: id
        required: true
        schema:
          description: Contact id.
          type: string
      responses:
        "204":
          description: Contact removed.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Contact not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Remove a contact
      tags:
      - Messenger
  /conversations:
    get:
      description: Returns 1:1 DMs for the signed-in user, newest activity first.
      operationId: listConversations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
          description: Conversation summaries.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: List conversations
      tags:
      - Messenger
    post:
      description: Opens an existing 1:1 conversation with the peer, or creates one.
        Provide user_id or username.
      operationId: openConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenConversation'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: The conversation summary.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The JSON body, user_id, or username is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Open or create a DM
      tags:
      - Messenger
  /conversations/{id}/messages:
    get:
      description: Returns messages newest first. Optional before (RFC3339) and limit
        (1-100, default 50).
      operationId: listMessages
      parameters:
      - description: Return messages created before this RFC3339 timestamp.
        in: query
        name: before
        schema:
          description: Return messages created before this RFC3339 timestamp.
          type: string
      - description: Page size from 1 to 100. Defaults to 50.
        in: query
        name: limit
        schema:
          description: Page size from 1 to 100. Defaults to 50.
          type: integer
      - description: Conversation id.
        in: path
        name: id
        required: true
        schema:
          description: Conversation id.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
          description: Messages in the conversation.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: before or limit is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The signed-in user is not a member.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conversation not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: List messages
      tags:
      - Messenger
    post:
      description: Persists a message and fans it out to conversation members over
        WebSocket.
      operationId: sendMessage
      parameters:
      - description: Conversation id.
        in: path
        name: id
        required: true
        schema:
          description: Conversation id.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: The created message.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The JSON body or body field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The signed-in user is not a member.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conversation not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Send a message
      tags:
      - Messenger
  /health:
    get:
      description: Reports whether the API can reach its database.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The API is ready.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The API cannot reach its database.
      summary: Check API health
      tags:
      - Messenger
  /me:
    get:
      operationId: getProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: The signed-in profile.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Get the signed-in profile
      tags:
      - Messenger
    patch:
      description: Updates only the fields present in the body.
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: The updated profile.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The JSON body or a profile field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Update the signed-in profile
      tags:
      - Messenger
  /users/lookup:
    get:
      description: Finds a registered user by exact username handle.
      operationId: lookupUser
      parameters:
      - description: Username handle.
        in: query
        name: username
        required: true
        schema:
          description: Username handle.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: The matching user profile.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: username is missing or invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      security:
      - bearerAuth: []
      summary: Look up a user by username
      tags:
      - Messenger
  /ws:
    get:
      description: 'Upgrades to a WebSocket. Auth via Authorization Bearer or access_token
        query. Server events: message.created. Client commands: message.send, ping.
        Keepalive: ping/pong.'
      operationId: websocket
      responses:
        "101":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSInfo'
          description: WebSocket upgrade accepted.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid access token.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected failure.
      summary: Open a WebSocket
      tags:
      - Messenger
components:
  schemas:
    AddContact:
      properties:
        user_id:
          description: Peer user id to save.
          type: string
        username:
          description: Peer username handle.
          type: string
      type: object
    AuthRequest:
      properties:
        username:
          description: Unique username handle.
          type: string
      required:
      - username
      type: object
    Contact:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        peer:
          $ref: '#/components/schemas/Profile'
      required:
      - id
      - peer
      - created_at
      type: object
    ContactList:
      properties:
        contacts:
          items:
            $ref: '#/components/schemas/Contact'
          type:
          - array
          - "null"
      required:
      - contacts
      type: object
    Conversation:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        last_message:
          $ref: '#/components/schemas/Message'
        peer:
          $ref: '#/components/schemas/Profile'
        unread:
          description: Unread count. Always 0 until receipts ship.
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - peer
      - unread
      - created_at
      - updated_at
      type: object
    ConversationList:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/Conversation'
          type:
          - array
          - "null"
      required:
      - conversations
      type: object
    Error:
      properties:
        error:
          description: Stable machine-readable code.
          type: string
        message:
          type: string
        retry_after:
          description: Seconds to wait before retrying. Present when error is rate_limited.
          type: integer
      required:
      - error
      - message
      type: object
    Health:
      properties:
        status:
          description: ok when the API can reach its database, unavailable otherwise.
          type: string
      required:
      - status
      type: object
    Message:
      properties:
        body:
          type: string
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        sender_id:
          type: string
      required:
      - id
      - conversation_id
      - sender_id
      - body
      - created_at
      type: object
    MessageList:
      properties:
        messages:
          description: Newest first.
          items:
            $ref: '#/components/schemas/Message'
          type:
          - array
          - "null"
      required:
      - messages
      type: object
    OpenConversation:
      properties:
        user_id:
          description: Peer user id to open or create a DM with.
          type: string
        username:
          description: Peer username handle.
          type: string
      type: object
    Profile:
      properties:
        about:
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        id:
          type: string
        profile_photo:
          type: string
        updated_at:
          format: date-time
          type: string
        username:
          description: Unique username handle.
          type: string
      required:
      - id
      - username
      - display_name
      - about
      - profile_photo
      - created_at
      - updated_at
      type: object
    ProfileUpdate:
      properties:
        about:
          description: Up to 139 characters.
          type:
          - "null"
          - string
        display_name:
          description: 1 to 64 characters.
          type:
          - "null"
          - string
        profile_photo:
          description: Up to 2048 characters.
          type:
          - "null"
          - string
      type: object
    RefreshRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    SendMessageRequest:
      properties:
        body:
          description: 1 to 4000 characters.
          type: string
      required:
      - body
      type: object
    Session:
      properties:
        access_token:
          type: string
        created:
          description: True when this request created the account.
          type: boolean
        expires_in:
          description: Access token lifetime in seconds.
          type: integer
        profile:
          $ref: '#/components/schemas/Profile'
        refresh_token:
          type: string
        token_type:
          description: Always Bearer.
          type: string
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - created
      - profile
      type: object
    TokenPair:
      properties:
        access_token:
          type: string
        expires_in:
          description: Access token lifetime in seconds.
          type: integer
        refresh_token:
          type: string
        token_type:
          description: Always Bearer.
          type: string
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      type: object
    WSInfo:
      properties:
        protocol:
          description: JSON frames. Auth via Authorization Bearer or access_token
            query.
          type: string
      required:
      - protocol
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from login, signup, or refresh.
      scheme: bearer
      type: http
